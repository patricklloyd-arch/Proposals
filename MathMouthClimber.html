<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mountain Climber - Fun Educational Game</title>
    <style>
        :root {
            --bg: #e8f4f8;
            --coral: #ff6b6b;
            --teal: #4ecdc4;
            --green: #51cf66;
            --purple: #a78bfa;
            --gold: #ffc107;
            --orange: #ff8c42;
            --btn1: #ff6b6b;
            --btn2: #4ecdc4;
            --btn3: #51cf66;
            --btn4: #a78bfa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #c9e8f5 0%, #e8f4f8 30%, #f0f7e8 60%, #e8f4f8 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game-wrapper {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 18px 20px 24px;
            max-width: 840px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            border: 3px solid #d0e8f0;
        }

        .game-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42, #ffc107);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.2;
            filter: drop-shadow(2px 2px 1px rgba(0, 0, 0, 0.15));
        }

        .game-title .icon {
            display: inline-block;
            animation: bounce-icon 0.6s ease-in-out infinite alternate;
        }
        .game-title .icon:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes bounce-icon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .canvas-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            border: 3px solid #b8d8e8;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 800/500;
            background: #87ceeb;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 17px;
        }

        .question-panel {
            background: linear-gradient(135deg, #fffef5, #fff8e7);
            border: 3px solid #e0c97f;
            border-radius: 18px;
            padding: 12px 28px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #5a3e1b;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            min-width: 200px;
            letter-spacing: 1px;
            background-image: radial-gradient(ellipse at center, rgba(255, 215, 100, 0.2) 0%, transparent 70%);
        }

        .question-panel::before {
            content: '📋';
            position: absolute;
            left: -15px;
            top: -20px;
            font-size: 1.8rem;
            transform: rotate(-10deg);
        }

        .question-panel .q-text {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .answer-btn {
            font-size: 1.4rem;
            font-weight: 700;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            letter-spacing: 1px;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
            position: relative;
            top: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .answer-btn:active {
            top: 4px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2), 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2), 0 6px 16px rgba(0, 0, 0, 0.15);
            filter: brightness(1.08);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
            top: 2px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-0 { background: linear-gradient(180deg, #ff8787, #e05555); }
        .btn-1 { background: linear-gradient(180deg, #5eddd5, #3aaba3); }
        .btn-2 { background: linear-gradient(180deg, #6ad97a, #3da84d); }
        .btn-3 { background: linear-gradient(180deg, #b9a0fb, #7c5ce0); }

        .answer-btn.correct-flash {
            animation: flash-green 0.5s ease;
        }
        .answer-btn.wrong-flash {
            animation: shake 0.5s ease;
        }

        @keyframes flash-green {
            0%, 100% { background: inherit; }
            50% { background: #4caf50 !important; box-shadow: 0 0 30px #4caf50; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
            color: #444;
        }

        .info-item {
            background: #f8fafb;
            border-radius: 12px;
            padding: 8px 16px;
            border: 2px solid #dde8ef;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .info-item .label { font-size: 0.85rem; color: #777; }
        .info-item .value { font-size: 1.2rem; color: #333; font-weight: 800; }

        .streak-badge {
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: 800;
            font-size: 0.9rem;
            animation: pulse-streak 0.8s ease-in-out infinite;
            display: none;
            letter-spacing: 0.5px;
        }
        .streak-badge.active { display: inline-block; }
        @keyframes pulse-streak {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .new-game-btn {
            background: linear-gradient(180deg, #ffb347, #ff8c00);
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #cc6f00, 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.15s ease;
            font-family: inherit;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .new-game-btn:active {
            box-shadow: 0 2px 0 #cc6f00, 0 2px 4px rgba(0, 0, 0, 0.15);
            transform: translateY(3px);
        }
        .new-game-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

        @media (max-width: 600px) {
            .game-wrapper { padding: 10px 8px 16px; border-radius: 20px; gap: 10px; }
            .game-title { font-size: 1.4rem; }
            .question-panel { font-size: 1.2rem; padding: 10px 18px; }
            .question-panel .q-text { font-size: 1.3rem; }
            .answer-btn { font-size: 1.1rem; padding: 12px 10px; border-radius: 12px; }
            .answers-grid { gap: 8px; }
            .info-bar { font-size: 0.8rem; gap: 8px; }
            .info-item { padding: 6px 10px; }
            .info-item .value { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-title">
        <span class="icon">⛰️</span> Math Mountain Climber <span class="icon">🧗</span>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="500" aria-label="Mountain climbing game scene"></canvas>
    </div>

    <div class="question-panel" id="questionPanel">
        <span class="q-text" id="questionText">8 + 7 = ?</span>
    </div>

    <div class="answers-grid" id="answersGrid">
        <button class="answer-btn btn-0" data-index="0">15</button>
        <button class="answer-btn btn-1" data-index="1">14</button>
        <button class="answer-btn btn-2" data-index="2">16</button>
        <button class="answer-btn btn-3" data-index="3">13</button>
    </div>

    <div class="info-bar">
        <div class="info-item">
            <span>🏔️</span> <span class="label">Height:</span> <span class="value" id="heightDisplay">0 / 10</span>
        </div>
        <div class="info-item">
            <span>⭐</span> <span class="label">Score:</span> <span class="value" id="scoreDisplay">0</span>
        </div>
        <div class="streak-badge" id="streakBadge">🔥 Streak: <span id="streakCount">0</span></div>
        <button class="new-game-btn" id="newGameBtn">🔄 New Climb!</button>
    </div>
</div>

<script>
    (function() {
        // ---------- AUDIO ENGINE (Web Audio API) ----------
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Resume if suspended (autoplay policy)
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {
                console.warn('Web Audio API not supported');
                audioCtx = null;
            }
        }

        function unlockAudio() {
            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, gain = 0.3, startTime = null) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const t = startTime !== null ? startTime : now;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            gainNode.gain.setValueAtTime(gain, t);
            gainNode.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + duration);
        }

        function playSound(effect) {
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            switch (effect) {
                case 'correct':
                    // Ascending two-note chime
                    playTone(523.25, 'sine', 0.15, 0.4, now);       // C5
                    playTone(659.25, 'sine', 0.25, 0.4, now + 0.1); // E5
                    break;
                case 'wrong':
                    // Descending buzz
                    playTone(200, 'sawtooth', 0.2, 0.3, now);
                    playTone(150, 'sawtooth', 0.3, 0.2, now + 0.15);
                    break;
                case 'victory':
                    // Short celebratory fanfare
                    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
                    notes.forEach((freq, i) => {
                        playTone(freq, 'sine', 0.25, 0.5, now + i * 0.12);
                    });
                    break;
                case 'click':
                    // Soft click
                    playTone(800, 'sine', 0.05, 0.15, now);
                    break;
                default: break;
            }
        }

        // ---------- GAME CODE (previous) ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const questionText = document.getElementById('questionText');
        const answerBtns = document.querySelectorAll('.answer-btn');
        const heightDisplay = document.getElementById('heightDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const streakBadge = document.getElementById('streakBadge');
        const streakCountEl = document.getElementById('streakCount');
        const newGameBtn = document.getElementById('newGameBtn');
        const questionPanel = document.getElementById('questionPanel');

        const TOTAL_STEPS = 10;
        let currentStep = 0;
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let currentQuestion = null;
        let isAnimating = false;
        let gameWon = false;
        let questionsAnswered = 0;
        let charX, charY;
        let targetCharX, targetCharY;
        let charMoveProgress = 1;
        let charBounceOffset = 0;
        let charPose = 'rest';
        let particles = [];
        let clouds = [];

        const waypoints = [
            { x: 400, y: 455 },
            { x: 335, y: 395 },
            { x: 465, y: 340 },
            { x: 355, y: 285 },
            { x: 445, y: 232 },
            { x: 370, y: 182 },
            { x: 425, y: 138 },
            { x: 382, y: 100 },
            { x: 408, y: 68 },
            { x: 394, y: 46 },
            { x: 400, y: 30 },
        ];

        function initClouds() {
            clouds = [
                { x: 100, y: 60, w: 90, h: 40, speed: 0.25, opacity: 0.9 },
                { x: 350, y: 30, w: 110, h: 48, speed: 0.35, opacity: 0.85 },
                { x: 580, y: 75, w: 80, h: 35, speed: 0.2, opacity: 0.9 },
                { x: 700, y: 40, w: 100, h: 42, speed: 0.3, opacity: 0.8 },
                { x: 200, y: 95, w: 75, h: 32, speed: 0.28, opacity: 0.75 },
            ];
        }

        function initGame() {
            currentStep = 0;
            score = 0;
            streak = 0;
            bestStreak = 0;
            gameWon = false;
            isAnimating = false;
            questionsAnswered = 0;
            particles = [];
            charX = waypoints[0].x;
            charY = waypoints[0].y;
            targetCharX = charX;
            targetCharY = charY;
            charMoveProgress = 1;
            charBounceOffset = 0;
            charPose = 'rest';
            updateUI();
            generateNewQuestion();
            streakBadge.classList.remove('active');
            questionPanel.style.background = 'linear-gradient(135deg, #fffef5, #fff8e7)';
            questionPanel.style.borderColor = '#e0c97f';
            enableButtons();
        }

        function updateUI() {
            heightDisplay.textContent = `${currentStep} / ${TOTAL_STEPS}`;
            scoreDisplay.textContent = score;
            streakCountEl.textContent = streak;
            if (streak >= 3 && !gameWon) {
                streakBadge.classList.add('active');
            } else {
                streakBadge.classList.remove('active');
            }
        }

        function enableButtons() { answerBtns.forEach(btn => btn.disabled = false); }
        function disableButtons() { answerBtns.forEach(btn => btn.disabled = true); }

        function generateNewQuestion() {
            const tier = Math.floor(currentStep / 3);
            let a, b, op, answer;
            const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            switch (tier) {
                case 0:
                    if (Math.random() < 0.6) { op = '+'; a = rand(2,15); b = rand(1,20-a); answer = a+b; }
                    else { op = '−'; a = rand(5,18); b = rand(1,a); answer = a-b; }
                    break;
                case 1:
                    const r = Math.random();
                    if (r < 0.35) { op = '+'; a = rand(10,60); b = rand(5,40); answer = a+b; }
                    else if (r < 0.65) { op = '−'; a = rand(15,60); b = rand(1,a); answer = a-b; }
                    else { op = '×'; a = rand(2,6); b = rand(2,10); answer = a*b; }
                    break;
                case 2:
                    const r2 = Math.random();
                    if (r2 < 0.4) { op = '×'; a = rand(3,12); b = rand(3,12); answer = a*b; }
                    else if (r2 < 0.7) { op = '÷'; b = rand(2,10); answer = rand(2,10); a = b*answer; }
                    else { op = '+'; a = rand(20,90); b = rand(10,80); answer = a+b; }
                    break;
                default:
                    const r3 = Math.random();
                    if (r3 < 0.3) { op = '×'; a = rand(6,15); b = rand(6,12); answer = a*b; }
                    else if (r3 < 0.55) { op = '÷'; b = rand(3,12); answer = rand(3,12); a = b*answer; }
                    else if (r3 < 0.75) { op = '−'; a = rand(40,100); b = rand(10,a-5); answer = a-b; }
                    else { op = '+'; a = rand(30,80); b = rand(20,70); answer = a+b; }
            }
            const distractors = new Set([answer]);
            while (distractors.size < 4) {
                let d = answer + rand(-6, 6);
                if (d !== answer && d >= 0 && !distractors.has(d)) distractors.add(d);
                if (distractors.size < 4) {
                    const offs = [-1,1,-2,2,-3,3,-5,5,-10,10];
                    d = answer + offs[rand(0, offs.length-1)];
                    if (d >= 0 && d !== answer && !distractors.has(d)) distractors.add(d);
                }
            }
            const options = Array.from(distractors);
            for (let i = options.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            currentQuestion = { text: `${a} ${op} ${b} = ?`, answer, options };
            questionText.textContent = currentQuestion.text;
            answerBtns.forEach((btn, i) => {
                btn.textContent = options[i];
                btn.className = 'answer-btn btn-' + i;
            });
        }

        function handleAnswer(btnIndex) {
            if (isAnimating || gameWon || !currentQuestion) return;
            const selected = currentQuestion.options[btnIndex];
            const isCorrect = selected === currentQuestion.answer;
            const btn = answerBtns[btnIndex];
            isAnimating = true;
            disableButtons();
            questionsAnswered++;
            playSound('click'); // subtle click on any answer

            if (isCorrect) {
                btn.classList.add('correct-flash');
                streak++;
                if (streak > bestStreak) bestStreak = streak;
                const streakBonus = Math.min(streak-1, 5) * 10;
                score += 50 + streakBonus;
                currentStep++;
                spawnCelebrationParticles(charX, charY);
                playSound('correct');

                if (currentStep >= TOTAL_STEPS) {
                    gameWon = true;
                    targetCharX = waypoints[TOTAL_STEPS].x;
                    targetCharY = waypoints[TOTAL_STEPS].y;
                    charMoveProgress = 0;
                    charPose = 'celebrate';
                    score += 200;
                    updateUI();
                    spawnCelebrationParticles(targetCharX, targetCharY, 60);
                    setTimeout(() => spawnCelebrationParticles(targetCharX, targetCharY, 40), 400);
                    setTimeout(() => spawnCelebrationParticles(targetCharX, targetCharY, 50), 800);
                    playSound('victory');
                    questionText.textContent = '🏆 You reached the summit! 🏆';
                    questionPanel.style.background = 'linear-gradient(135deg, #fffde7, #ffe082)';
                    questionPanel.style.borderColor = '#ffc107';
                    setTimeout(() => { isAnimating = false; updateUI(); }, 1500);
                } else {
                    targetCharX = waypoints[currentStep].x;
                    targetCharY = waypoints[currentStep].y;
                    charMoveProgress = 0;
                    charPose = 'climb';
                    updateUI();
                    setTimeout(() => {
                        generateNewQuestion();
                        enableButtons();
                        isAnimating = false;
                        charPose = 'rest';
                        updateUI();
                    }, 600);
                }
            } else {
                btn.classList.add('wrong-flash');
                streak = 0;
                score = Math.max(0, score - 15);
                spawnWrongParticles(charX, charY);
                playSound('wrong');
                charBounceOffset = -6;
                setTimeout(() => { charBounceOffset = 6; }, 80);
                setTimeout(() => { charBounceOffset = -3; }, 160);
                setTimeout(() => { charBounceOffset = 3; }, 240);
                setTimeout(() => { charBounceOffset = 0; }, 320);
                updateUI();
                questionPanel.style.background = 'linear-gradient(135deg, #fff5f5, #ffe0e0)';
                questionPanel.style.borderColor = '#ffaaaa';
                setTimeout(() => {
                    questionPanel.style.background = 'linear-gradient(135deg, #fffef5, #fff8e7)';
                    questionPanel.style.borderColor = '#e0c97f';
                    generateNewQuestion();
                    enableButtons();
                    isAnimating = false;
                    updateUI();
                }, 500);
            }
            setTimeout(() => btn.classList.remove('correct-flash', 'wrong-flash'), 550);
        }

        function spawnCelebrationParticles(x, y, count = 35) {
            const colors = ['#ff6b6b','#ffc107','#51cf66','#4ecdc4','#ff8c42','#a78bfa','#ff4081','#00e5ff'];
            for (let i=0; i<count; i++) {
                const angle = Math.random()*Math.PI*2;
                const speed = 2+Math.random()*8;
                particles.push({
                    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - Math.random()*4,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    size: 3+Math.random()*6, life:1, decay:0.012+Math.random()*0.03, gravity:0.08
                });
            }
        }

        function spawnWrongParticles(x, y) {
            const colors = ['#999','#bbb','#777','#aaa'];
            for (let i=0; i<15; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*4, vy: -Math.random()*3,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    size:2+Math.random()*3, life:1, decay:0.04+Math.random()*0.04, gravity:0.2
                });
            }
        }

        function updateParticles() {
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i,1);
            }
        }

        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > W+120) { cloud.x = -120; cloud.y = 20+Math.random()*100; }
            });
        }

        function updateCharacter() {
            if (charMoveProgress < 1) {
                charMoveProgress += 0.04;
                if (charMoveProgress >= 1) {
                    charMoveProgress = 1; charX = targetCharX; charY = targetCharY;
                } else {
                    const t = charMoveProgress;
                    const ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
                    charX = targetCharX + (charX - targetCharX)*(1-ease);
                    charY = targetCharY + (charY - targetCharY)*(1-ease);
                    const arcHeight = -20 * Math.sin(t*Math.PI);
                    charY += arcHeight * (1-Math.abs(t-0.5)*2);
                }
            }
        }

        // Drawing functions (unchanged except for brevity, full code as before)
        function drawSky() {
            const grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0,'#7ec8f8'); grad.addColorStop(0.55,'#b8dff5');
            grad.addColorStop(0.85,'#d4eaf7'); grad.addColorStop(1,'#e8f4f8');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
        }
        function drawSun() {
            const sx=680, sy=70;
            const glow = ctx.createRadialGradient(sx,sy,20,sx,sy,100);
            glow.addColorStop(0,'rgba(255,255,200,0.9)'); glow.addColorStop(0.3,'rgba(255,240,150,0.5)');
            glow.addColorStop(0.7,'rgba(255,200,100,0.1)'); glow.addColorStop(1,'rgba(255,180,50,0)');
            ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,100,0,Math.PI*2); ctx.fill();
            const sun = ctx.createRadialGradient(sx,sy,5,sx,sy,38);
            sun.addColorStop(0,'#fffde0'); sun.addColorStop(0.5,'#ffe082'); sun.addColorStop(1,'#ffb300');
            ctx.fillStyle=sun; ctx.beginPath(); ctx.arc(sx,sy,38,0,Math.PI*2); ctx.fill();
        }
        function drawCloud(c) {
            ctx.fillStyle=`rgba(255,255,255,${c.opacity})`;
            ctx.beginPath(); ctx.arc(c.x,c.y,c.h*0.5,0,Math.PI*2);
            ctx.arc(c.x-c.w*0.3,c.y+c.h*0.1,c.h*0.4,0,Math.PI*2);
            ctx.arc(c.x+c.w*0.25,c.y+c.h*0.05,c.h*0.45,0,Math.PI*2);
            ctx.arc(c.x+c.w*0.15,c.y-c.h*0.15,c.h*0.38,0,Math.PI*2);
            ctx.arc(c.x-c.w*0.1,c.y-c.h*0.1,c.h*0.35,0,Math.PI*2); ctx.fill();
        }
        function drawBackgroundMountains() {
            ctx.fillStyle='#c8dde8'; ctx.beginPath(); ctx.moveTo(50,430); ctx.lineTo(180,180); ctx.lineTo(340,430); ctx.fill();
            ctx.fillStyle='#bfd5e2'; ctx.beginPath(); ctx.moveTo(480,430); ctx.lineTo(620,150); ctx.lineTo(770,430); ctx.fill();
        }
        function drawMainMountain() {
            const mtn = ctx.createLinearGradient(400,30,400,500);
            mtn.addColorStop(0,'#8a9ead'); mtn.addColorStop(0.5,'#6b7f8c'); mtn.addColorStop(1,'#4a5d66');
            ctx.fillStyle=mtn; ctx.beginPath(); ctx.moveTo(400,30); ctx.lineTo(90,500); ctx.lineTo(710,500); ctx.fill();
            ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.moveTo(400,30); ctx.quadraticCurveTo(340,80,320,130);
            ctx.quadraticCurveTo(370,100,390,85); ctx.quadraticCurveTo(430,90,480,125); ctx.quadraticCurveTo(460,75,400,30); ctx.fill();
            ctx.fillStyle='#5c3d1a'; ctx.fillRect(398,22,4,40); ctx.fillStyle='#ff4444';
            ctx.beginPath(); ctx.moveTo(402,22); ctx.lineTo(422,32); ctx.lineTo(402,42); ctx.fill();
        }
        function drawTrail() {
            ctx.strokeStyle='#c9a87c'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(waypoints[0].x,waypoints[0].y);
            for(let i=1;i<waypoints.length;i++) ctx.lineTo(waypoints[i].x,waypoints[i].y); ctx.stroke();
            for(let i=1;i<waypoints.length;i++) {
                const wp=waypoints[i]; const reached = i<=currentStep;
                ctx.fillStyle=reached?'#ff6b6b':'#ccc'; ctx.beginPath(); ctx.arc(wp.x,wp.y,6,0,Math.PI*2); ctx.fill();
            }
        }
        function drawTrees() {
            const trees=[{x:140,y:465,s:1},{x:170,y:475,s:1.3},{x:550,y:460,s:1.1},{x:590,y:472,s:1.4},{x:630,y:455,s:1}];
            trees.forEach(t=>{ ctx.fillStyle='#8B6914'; ctx.fillRect(t.x-5*t.s,t.y-18*t.s,10*t.s,18*t.s);
                const cols=['#3d8b37','#4a9e3f','#357a30'];
                for(let l=0;l<3;l++){ ctx.fillStyle=cols[l]; ctx.beginPath(); ctx.moveTo(t.x,t.y-20*t.s-l*14*t.s-(16-l*3)*t.s);
                    ctx.lineTo(t.x+(16-l*3)*t.s,t.y-20*t.s-l*14*t.s+(16-l*3)*0.5*t.s);
                    ctx.lineTo(t.x-(16-l*3)*t.s,t.y-20*t.s-l*14*t.s+(16-l*3)*0.5*t.s); ctx.fill(); } });
        }
        function drawCharacter(x,y) {
            const cx=x, cy=y+charBounceOffset;
            ctx.save(); ctx.translate(cx,cy);
            ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,22,10,4,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#4a3728'; ctx.fillRect(-4,10,8,12); ctx.fillStyle='#3d2b1a'; ctx.fillRect(-5,19,10,5);
            const body=ctx.createLinearGradient(0,-2,0,14); body.addColorStop(0,'#4a90d9'); body.addColorStop(1,'#357abd');
            ctx.fillStyle=body; ctx.beginPath(); ctx.roundRect(-8,-2,16,16,4); ctx.fill();
            ctx.fillStyle='#8B6914'; ctx.fillRect(-8,8,16,3); ctx.fillStyle='#e87830'; ctx.beginPath(); ctx.roundRect(-12,-3,6,12,3); ctx.fill();
            if(charPose==='celebrate'){ ctx.fillStyle='#4a90d9'; ctx.fillRect(-12,-8,5,10); ctx.fillRect(7,-8,5,10); }
            else if(charPose==='climb'){ ctx.fillRect(-11,-5,5,9); ctx.fillRect(6,2,5,9); }
            else { ctx.fillRect(-11,1,5,9); ctx.fillRect(6,1,5,9); }
            ctx.fillStyle='#f4c7a0'; ctx.beginPath(); ctx.arc(0,-8,9,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#e0443c'; ctx.beginPath(); ctx.arc(0,-10,10,Math.PI,0); ctx.fill(); ctx.fillRect(-10,-10,20,3);
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-9,3,0,Math.PI*2); ctx.fill(); ctx.arc(3,-9,3,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(-3,-8.5,1.5,0,Math.PI*2); ctx.fill(); ctx.arc(3,-8.5,1.5,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle='#5a3020'; ctx.beginPath(); ctx.arc(0,-6,4,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
            ctx.restore();
        }
        function drawParticles() {
            particles.forEach(p=>{
                const hex=p.color; const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
                ctx.fillStyle=`rgba(${r},${g},${b},${p.life})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
            });
        }
        function drawVictoryOverlay() {
            if(!gameWon) return;
            ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.roundRect(150,170,500,120,20); ctx.fill();
            ctx.strokeStyle='#ffc107'; ctx.lineWidth=4; ctx.stroke();
            ctx.fillStyle='#333'; ctx.font='bold 32px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('🏔️ Summit Reached! 🏔️',400,210);
            ctx.fillText(`Score: ${score} ⭐ | Best Streak: ${bestStreak} 🔥`,400,250);
            ctx.textAlign='start';
        }

        function render(timestamp) {
            ctx.clearRect(0,0,W,H);
            drawSky(); drawSun(); clouds.forEach(c=>drawCloud(c)); drawBackgroundMountains(); drawMainMountain();
            drawTrail(); drawTrees();
            const birdTime = timestamp/800;
            drawBird(250+Math.sin(birdTime*0.7)*40,140+Math.cos(birdTime*0.9)*15,birdTime*3);
            drawBird(520+Math.cos(birdTime*0.6)*50,120+Math.sin(birdTime*0.8)*18,birdTime*2.5+1);
            drawCharacter(charX,charY); drawParticles(); drawVictoryOverlay();
        }
        function drawBird(x,y,phase){ ctx.strokeStyle='#444'; ctx.lineWidth=2; const w=Math.sin(phase)*6;
            ctx.beginPath(); ctx.moveTo(x-8,y+w); ctx.quadraticCurveTo(x-3,y-5,x,y); ctx.quadraticCurveTo(x+3,y-5,x+8,y+w); ctx.stroke(); }

        function gameLoop(timestamp) {
            updateClouds(); updateCharacter(); updateParticles();
            render(timestamp);
            requestAnimationFrame(gameLoop);
        }

        // Event listeners with sound
        answerBtns.forEach(btn => {
            btn.addEventListener('click', () => { handleAnswer(parseInt(btn.dataset.index)); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); handleAnswer(parseInt(btn.dataset.index)); });
        });
        document.addEventListener('keydown', (e) => {
            if (isAnimating || gameWon) return;
            const keyMap = { '1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3 };
            if (keyMap[e.key.toLowerCase()] !== undefined) handleAnswer(keyMap[e.key.toLowerCase()]);
        });
        newGameBtn.addEventListener('click', () => {
            playSound('click');
            initGame();
        });

        // Start
        initClouds(); initGame();
        charX=waypoints[0].x; charY=waypoints[0].y; targetCharX=charX; targetCharY=charY;
        requestAnimationFrame(gameLoop);
        console.log('🏔️ Math Mountain Climber with sound effects ready!');
    })();
</script>
</body>
</html>
